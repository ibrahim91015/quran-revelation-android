name: Revelation verification

on:
  workflow_dispatch:
  push:
    branches: [main, codex/revelation-android16]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v6
      - name: Build standalone debug APK
        run: ./gradlew :app:assembleMadaniDebug -PdisableFirebase --max-workers=4
      - name: Unit and regression tests
        run: ./gradlew testMadaniDebug testReleaseUnitTest -PdisableFirebase --max-workers=4
      - name: Database migrations
        run: ./gradlew verifySqlDelightMigration -PdisableFirebase --max-workers=4
      - name: Android release lint
        run: ./gradlew :app:lintMadaniRelease -PdisableFirebase --max-workers=4
      - name: Tanzil and reciter endpoint checks
        run: python3 tools/verify_revelation_sources.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: revelation-verification
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            app/build/reports/lint-results-madaniRelease.*
            build/revelation-verification/**
          retention-days: 30
